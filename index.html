<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uch Qahramon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
/* Layout: white arena, one column on the phone. Three fighter cards on top, the action pad below, the round report under it. */
:root{
  --bg:#ffffff; --ink:#15161a; --muted:#6b6f7a; --line:#e6e7ec; --soft:#f4f5f8;
  --p0:#e5383b; --p1:#2d6cdf; --p2:#ef8a00;
  --hp:#1fa65a; --hurt:#e5383b; --shield:#2d6cdf; --zap:#f2b705;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font-family:var(--body);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{cursor:default}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--p0)}
.net{font:700 12px var(--body);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#c4c6cf;flex:none}
.dot.on{background:var(--hp);box-shadow:0 0 0 3px color-mix(in srgb,var(--hp) 20%,transparent)}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:0;line-height:1.5}
.notice{background:var(--soft);border-radius:12px;padding:12px 14px;color:var(--muted);line-height:1.5;font-size:14px}
.notice b{color:var(--ink)}

/* pick + lobby */
.roster{display:grid;gap:10px}
.who{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:16px;background:var(--bg)}
.who.mine{border-color:var(--c)}
.badge{width:46px;height:46px;border-radius:12px;background:var(--c);color:#fff;font:400 22px var(--display);display:flex;align-items:center;justify-content:center;flex:none}
.who .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.who .nm{font-weight:800;font-size:17px}
.who .st{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font:800 12px var(--body);padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.on{background:color-mix(in srgb,var(--hp) 14%,var(--bg));color:var(--hp)}
.f .pill{font-size:10.5px;padding:3px 7px;gap:4px}
.here{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);line-height:1.45;font-size:14px}
.here b{font-weight:800}
#share{font:600 14px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--soft);color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
.btn{font-weight:800;font-size:15px;padding:11px 16px;border-radius:12px;border:0;background:var(--ink);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{background:var(--soft);color:#a9acb6}
.btn.big{font:400 20px var(--display);padding:16px;border-radius:14px;width:100%}

/* arena */
.fighters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f{border:2px solid var(--line);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;background:var(--bg)}
.f.me{border-color:var(--c)}
.f.dead{opacity:.45}
.f .badge{width:52px;height:52px;font-size:24px;position:relative}
.f .nm{font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .st{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;justify-content:center}
.bar{width:100%;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hp);border-radius:99px;transition:width .5s ease}
.bar.low i{background:var(--hurt)}
.hpn{font:400 15px var(--display);font-variant-numeric:tabular-nums}
.en{display:flex;gap:3px}
.en span{width:14px;height:6px;border-radius:2px;background:var(--soft)}
.en span.on{background:var(--zap)}
.chose{font-size:11px;font-weight:700;color:var(--muted);min-height:1.3em}
.chose.ok{color:var(--hp)}
.float{position:absolute;top:4px;left:50%;transform:translateX(-50%);font:400 20px var(--display);pointer-events:none;animation:up 1.4s ease forwards}
.float.minus{color:var(--hurt)} .float.plus{color:var(--hp)}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.hit{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shielded .badge::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:3px solid var(--shield)}

.pad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.act b{font-size:15px;font-weight:800}
.act small{font-size:12px;color:var(--muted);line-height:1.35}
.act.atk{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.act.atk b{color:var(--c)}
.act.sup{background:color-mix(in srgb,var(--zap) 12%,var(--bg));border-color:var(--zap)}
.act:disabled{opacity:.38}
.act:not(:disabled):active{transform:scale(.97)}
.wait{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);line-height:1.5}
.wait b{color:var(--ink)}
.log{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.log li{background:var(--soft);border-radius:10px;padding:9px 12px;line-height:1.4;font-size:14px}
.lbl{font:800 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.win{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:18px;border-radius:18px;background:var(--soft)}
.win .crown{font:400 34px var(--display);color:var(--c)}
.rules{display:grid;gap:6px;font-size:13.5px;color:var(--muted);line-height:1.45}
.rules b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.hit,.float{animation:none}.bar i{transition:none}}
</style>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Uch <em>Qahramon</em></h1>
    <div class="net" id="net"><span class="dot"></span><span>Ulanmoqda...</span></div>
  </header>
  <main id="app"></main>
</div>

<script>
(() => {
  const ROSTER = ['Shahzod', 'Sardor', 'Ahmat'];
  const COLORS = ['var(--p0)', 'var(--p1)', 'var(--p2)'];
  const MAX_HP = 15, ATK = 3, SUP = 6, SUP_SHIELD = 3, HEAL = 2, TEAM = 1;
  const $app = document.getElementById('app'), $net = document.getElementById('net');

  // ---------- connection: a public MQTT broker, one private "xona" (room) per link ----------
  const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
  const params = new URLSearchParams(location.search);
  let code = (params.get('xona') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
  if (!code) {
    code = Math.random().toString(36).slice(2, 8);
    params.set('xona', code);
    try { history.replaceState(null, '', location.pathname + '?' + params); } catch (e) {}
  }
  const T = 'uchqahramon/v1/' + code, KEY = 'uq:' + code;
  const shareUrl = location.origin + location.pathname + '?xona=' + code;

  let client = null, connected = false, brokerIdx = 0, everConnected = false;
  let me = -1, gid = 0, myMoves = [];
  let theirs = [null, null, null];     // {g, m} last seen moves per player
  let online = [false, false, false];
  let clash = false;
  let lastRound = 0, noRoom = false;
  let local = false, localMoves = [[], [], []], handoff = true;  // one phone passed around

  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (Number.isInteger(s.me)) me = s.me;
    if (s.gid) { gid = s.gid; myMoves = Array.isArray(s.m) ? s.m : []; }
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ me, gid, m: myMoves })); } catch (e) {} };
  const pub = (t, v) => { if (client && connected) client.publish(`${T}/${t}`, v, { retain: true, qos: 1 }); };
  const pushMoves = () => { if (me >= 0) pub(`m/${me}`, JSON.stringify({ g: gid, m: myMoves })); };

  function setNet() {
    $net.innerHTML = local ? '<span class="dot on"></span><span>Bitta telefon</span>'
      : connected ? '<span class="dot on"></span><span>Onlayn</span>'
      : everConnected ? '<span class="dot"></span><span>Qayta ulanmoqda...</span>'
      : noRoom ? '<span class="dot"></span><span>Oflayn</span>' : '<span class="dot"></span><span>Ulanmoqda...</span>';
  }

  let queued = false;
  const later = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };

  function onMsg(topic, msg) {
    const [kind, n] = topic.slice(T.length + 1).split('/');
    const i = +n;
    if (kind === 'on' && i >= 0 && i < 3) online[i] = msg === '1';
    else if (kind === 'g') {
      const g = +msg || 0;
      if (g !== gid) { gid = g; myMoves = []; theirs = [null, null, null]; lastRound = 0; save(); pushMoves(); }
    } else if (kind === 'm' && i >= 0 && i < 3) {
      try {
        const d = JSON.parse(msg);
        if (typeof d.g !== 'number' || !Array.isArray(d.m)) return;
        const m = d.m.filter(x => typeof x === 'string').slice(0, 200);
        if (i === me) { if (d.g === gid && m.length > myMoves.length) { myMoves = m; save(); } }
        else theirs[i] = { g: d.g, m };
      } catch (e) { return; }
    }
    later();
  }

  function connect() {
    if (local || typeof mqtt === 'undefined') { noRoom = true; setNet(); render(); return; }
    if (client) { const old = client; client = null; try { old.end(true); } catch (e) {} }
    connected = false; setNet();
    const opts = { clientId: 'uq_' + Math.random().toString(36).slice(2, 10), keepalive: 15, reconnectPeriod: 2000, connectTimeout: 8000, clean: true };
    if (me >= 0) opts.will = { topic: `${T}/on/${me}`, payload: '0', retain: true, qos: 1 };
    const c = client = mqtt.connect(BROKERS[brokerIdx], opts);
    let ok = false;
    c.on('connect', () => {
      if (c !== client) return;
      ok = true; connected = true; everConnected = true; noRoom = false; setNet();
      c.subscribe(`${T}/#`, { qos: 1 });
      if (me >= 0) { pub(`on/${me}`, '1'); pushMoves(); }
      render();
    });
    c.on('close', () => { if (c === client && connected) { connected = false; setNet(); render(); } });
    c.on('message', (t, buf) => { if (c === client) onMsg(t, buf.toString()); });
    setTimeout(() => {
      if (ok || c !== client) return;
      noRoom = true; brokerIdx = (brokerIdx + 1) % BROKERS.length; render(); connect();
    }, 9000);
  }

  // ---------- game rules: one pure function of everyone's moves ----------
  function movesOf(i) {
    if (local) return localMoves[i];
    if (i === me) return myMoves;
    const k = theirs[i];
    return k && k.g === gid ? k.m : [];
  }
  function simulate() {
    const hp = [MAX_HP, MAX_HP, MAX_HP], en = [0, 0, 0], lastDef = [false, false, false];
    const all = [0, 1, 2].map(movesOf);
    const rounds = [];
    let r = 0, over = false, winner = -1;
    while (!over) {
      const alive = [0, 1, 2].filter(i => hp[i] > 0);
      if (!alive.every(i => typeof all[i][r] === 'string')) break;
      const act = [null, null, null], tgt = [-1, -1, -1];
      for (const i of alive) {
        let a = all[i][r][0], t = +all[i][r].slice(1);
        if ((a === 'a' || a === 's') && !(t >= 0 && t < 3 && t !== i && hp[t] > 0)) a = 'x';
        if (a === 's' && en[i] < 3) a = 'a';
        if (a === 'd' && lastDef[i]) a = 'x';
        if (!'asdh'.includes(a)) a = 'x';
        act[i] = a; tgt[i] = t;
      }
      const dmg = [0, 0, 0], heal = [0, 0, 0], log = [], hits = [0, 0, 0];
      for (const i of alive) {
        const a = act[i], t = tgt[i];
        if (a === 'a' || a === 's') hits[t]++;
      }
      for (const i of alive) {
        const a = act[i], t = tgt[i], A = ROSTER[i], T = ROSTER[t];
        if (a === 'a') {
          if (act[t] === 'd') { dmg[i] += 1; log.push(`${A} ${T}ga zarba berdi, lekin qalqonga urildi va o'zi 1 jon yo'qotdi.`); }
          else { const d = ATK + (hits[t] > 1 ? TEAM : 0); dmg[t] += d; log.push(`${A} ${T}ga zarba berdi: −${d}.`); }
        } else if (a === 's') {
          const d = (act[t] === 'd' ? SUP_SHIELD : SUP) + (hits[t] > 1 ? TEAM : 0);
          dmg[t] += d;
          log.push(act[t] === 'd' ? `${A} kuchli zarba bilan ${T}ning qalqonini yorib o'tdi: −${d}.` : `${A} ${T}ga kuchli zarba berdi: −${d}!`);
        } else if (a === 'd') log.push(`${A} qalqon ko'tardi.`);
        else if (a === 'h') { heal[i] += HEAL; log.push(`${A} yarasini bog'ladi: +${HEAL}.`); }
        else log.push(`${A} hech narsa qilmadi.`);
      }
      const ganged = [0, 1, 2].filter(t => hits[t] > 1 && act[t] !== 'd');
      for (const t of ganged) log.push(`Ikkalasi birga ${ROSTER[t]}ga yopishdi! Har bir zarbaga +${TEAM}.`);
      const before = hp.slice();
      for (const i of alive) {
        hp[i] = Math.max(0, Math.min(MAX_HP, hp[i] + heal[i]) - dmg[i]);
        en[i] = act[i] === 's' ? 0 : Math.min(3, en[i] + 1);
        lastDef[i] = act[i] === 'd';
        if (hp[i] === 0) log.push(`${ROSTER[i]} yiqildi!`);
      }
      rounds.push({ log, delta: [0, 1, 2].map(i => hp[i] - before[i]), def: [0, 1, 2].map(i => act[i] === 'd') });
      r++;
      const left = [0, 1, 2].filter(i => hp[i] > 0);
      if (left.length <= 1) { over = true; winner = left.length ? left[0] : -1; }
    }
    return { hp, en, lastDef, round: r, rounds, over, winner };
  }

  // ---------- actions ----------
  function pick(i) { if (online[i]) return; me = i; save(); connect(); render(); }
  function leave() { pub(`on/${me}`, '0'); me = -1; save(); connect(); render(); }
  function startBattle() {
    if (local) { localMoves = [[], [], []]; handoff = true; lastRound = 0; return render(); }
    gid = Date.now(); myMoves = []; theirs = [null, null, null]; lastRound = 0;
    pub('g', String(gid)); pushMoves(); save(); render();
  }
  function choose(code) {
    const st = simulate();
    if (local) {
      if (localMoves[me].length !== st.round) return;
      localMoves[me] = localMoves[me].concat(code); handoff = true; return render();
    }
    if (myMoves.length !== st.round || !connected) return;
    myMoves = myMoves.concat(code); pushMoves(); save(); render();
  }

  // ---------- render ----------
  let lastHtml = '';
  const setApp = h => { if (h !== lastHtml) { $app.innerHTML = h; lastHtml = h; } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const status = i => local ? '' : online[i]
    ? `<span class="pill on"><span class="dot on"></span>Onlayn</span>`
    : `<span class="pill"><span class="dot"></span>Oflayn</span>`;
  function hereNote() {
    return `<div class="here" style="flex-direction:column;align-items:stretch;gap:8px">
      <span>Do'stlaringizga shu havolani yuboring:</span>
      <input id="share" readonly value="${esc(shareUrl)}" onclick="this.select()">
      <button class="btn" data-copy>Havoladan nusxa olish</button></div>`;
  }

  function render() {
    if (local) {
      const st = simulate();
      const next = [0, 1, 2].find(i => st.hp[i] > 0 && localMoves[i].length <= st.round);
      me = st.over || next === undefined ? -1 : next;
      return renderArena();
    }
    if (me < 0) return renderPick();
    if (!gid) return renderLobby();
    renderArena();
  }

  function renderPick() {
    setApp(`
      <div style="display:flex;flex-direction:column;gap:14px">
        <h2>Siz kimsiz?</h2>
        ${noRoom ? offlineNote() : hereNote()}
        <div class="roster">${ROSTER.map((n, i) => `
          <div class="who" style="--c:${COLORS[i]}">
            <div class="badge">${n[0]}</div>
            <div class="meta"><span class="nm">${n}</span><span class="st">${status(i)}</span></div>
            <button class="btn" data-pick="${i}" ${online[i] ? 'disabled' : ''}>${online[i] ? 'Band' : 'Bu menman'}</button>
          </div>`).join('')}
        </div>
      </div>`);
  }

  function renderLobby() {
    const all = online.every(Boolean);
    setApp(`
      <div style="display:flex;flex-direction:column;gap:14px">
        <h2>Salom, <span style="color:${COLORS[me]}">${ROSTER[me]}</span>!</h2>
        <p class="sub">${all ? 'Hamma joyida. Jangni boshlash mumkin.' : 'Uchala qahramon onlayn bo\'lishini kuting.'}</p>
        ${clash ? `<div class="notice"><b>Diqqat:</b> ${ROSTER[me]} ismi boshqa telefonda ham tanlangan. Bittangiz boshqa ism tanlang.</div>` : ''}
        ${noRoom ? offlineNote() : hereNote()}
        <div class="roster">${ROSTER.map((n, i) => `
          <div class="who${i === me ? ' mine' : ''}" style="--c:${COLORS[i]}">
            <div class="badge">${n[0]}</div>
            <div class="meta"><span class="nm">${n}${i === me ? ' (siz)' : ''}</span><span class="st">${status(i)}</span></div>
          </div>`).join('')}
        </div>
        <button class="btn big" data-start ${all ? '' : 'disabled'}>Jangni boshlash</button>
        <button class="btn ghost" data-leave>Boshqa ism tanlash</button>
      </div>`);
  }

  function renderArena() {
    const st = simulate();
    const mine = me >= 0 ? movesOf(me).length : 0;
    const newRound = st.round > lastRound;
    const last = st.rounds[st.round - 1];
    const fighters = ROSTER.map((n, i) => {
      const pct = st.hp[i] / MAX_HP * 100;
      const chosen = movesOf(i).length > st.round;
      const alive = st.hp[i] > 0;
      const hurt = newRound && last && last.delta[i] < 0, healed = newRound && last && last.delta[i] > 0;
      return `
        <div class="f${i === me ? ' me' : ''}${alive ? '' : ' dead'}${last && last.def[i] ? ' shielded' : ''}${hurt ? ' hit' : ''}" style="--c:${COLORS[i]}">
          ${hurt ? `<span class="float minus">${last.delta[i]}</span>` : ''}${healed ? `<span class="float plus">+${last.delta[i]}</span>` : ''}
          <div class="badge">${n[0]}</div>
          <div class="nm">${n}${i === me && !local ? ' (siz)' : ''}</div>
          <div class="st">${status(i)}</div>
          <div class="bar${pct <= 34 ? ' low' : ''}"><i style="width:${pct}%"></i></div>
          <div class="hpn">${st.hp[i]}<span style="color:var(--muted);font-size:11px">/${MAX_HP}</span></div>
          <div class="en" aria-label="Kuch: ${st.en[i]}/3">${[0, 1, 2].map(k => `<span class="${k < st.en[i] ? 'on' : ''}"></span>`).join('')}</div>
          <div class="chose${chosen ? ' ok' : ''}">${st.over || !alive ? (alive ? '' : 'Yiqildi') : chosen ? 'Tanladi ✓' : 'O\'ylayapti...'}</div>
        </div>`;
    }).join('');
    if (newRound) lastRound = st.round;

    let pad = '';
    if (st.over) {
      const w = st.winner;
      pad = `<div class="win" style="--c:${w >= 0 ? COLORS[w] : 'var(--ink)'}">
          <div class="lbl">${st.round}-raundda tugadi</div>
          <div class="crown">${w >= 0 ? `${ROSTER[w]} g'olib!` : 'Durang!'}</div>
          <p class="sub">${w === me ? 'Zo\'r jang qildingiz!' : w >= 0 ? 'Keyingi safar sizning navbatingiz.' : 'Hamma bir vaqtda yiqildi.'}</p>
          <button class="btn big" data-start ${local || online.every(Boolean) ? '' : 'disabled'}>Yangi jang</button>
          ${local || online.every(Boolean) ? '' : '<p class="sub" style="font-size:13px">Yangi jang uchun uchalangiz onlayn bo\'lishingiz kerak.</p>'}
        </div>`;
    } else if (local && handoff) {
      pad = `<div class="wait" style="--c:${COLORS[me]}">Telefonni <b style="color:var(--c)">${ROSTER[me]}</b>ga bering.<br><br>
        <button class="btn big" style="background:var(--c)" data-ready>Men ${ROSTER[me]}, tayyorman</button></div>`;
    } else if (st.hp[me] <= 0) {
      pad = `<div class="wait"><b>Siz yiqildingiz.</b><br>Qolgan ikkisining jangini tomosha qiling.</div>`;
    } else if (mine > st.round) {
      const waiting = [0, 1, 2].filter(i => st.hp[i] > 0 && movesOf(i).length <= st.round).map(i => ROSTER[i]);
      pad = `<div class="wait">Tanlovingiz: <b>${describe(movesOf(me)[st.round])}</b><br>Kutilmoqda: ${waiting.map(esc).join(', ')}</div>`;
    } else {
      const foes = [0, 1, 2].filter(i => i !== me && st.hp[i] > 0);
      const canSup = st.en[me] >= 3, canDef = !st.lastDef[me];
      pad = `<div class="pad">
          ${foes.map(t => `<button class="act atk" style="--c:${COLORS[t]}" data-act="a${t}"><b>${ROSTER[t]}ga zarba</b><small>−${ATK}</small></button>`).join('')}
          <button class="act" data-act="d" ${canDef ? '' : 'disabled'}><b>Qalqon</b><small>${canDef ? '🛡' : 'Ketma-ket emas'}</small></button>
          <button class="act" data-act="h"><b>Davolanish</b><small>+${HEAL}</small></button>
          ${foes.map(t => `<button class="act sup" data-act="s${t}" ${canSup ? '' : 'disabled'}><b>Kuchli zarba: ${ROSTER[t]}</b><small>${canSup ? `−${SUP}` : `${st.en[me]}/3`}</small></button>`).join('')}
        </div>`;
    }

    const anyOff = !local && !online.every(Boolean) && !st.over;
    setApp(`
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="fighters">${fighters}</div>
        ${anyOff ? `<div class="notice">${[0, 1, 2].filter(i => !online[i]).map(i => `<b>${ROSTER[i]}</b>`).join(', ')} oflayn. Qaytib kirishini kuting.</div>` : ''}
        ${noRoom && !local ? offlineNote() : ''}
        ${!st.over ? `<div class="lbl">${st.round + 1}-raund</div>` : ''}
        ${pad}
        ${last ? `<div class="lbl">${st.round}-raund natijasi</div><ul class="log">${last.log.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
      </div>`);
  }

  function describe(code) {
    const a = code[0], t = +code.slice(1);
    return a === 'a' ? `${ROSTER[t]}ga zarba` : a === 's' ? `${ROSTER[t]}ga kuchli zarba` : a === 'd' ? 'Qalqon' : 'Davolanish';
  }
  function offlineNote() {
    return `<div class="notice" style="display:flex;flex-direction:column;gap:10px"><span><b>Onlayn ulanib bo'lmadi.</b> Bu telefon boshqalarni ko'ra olmayapti.</span>
      <button class="btn" data-local>Bitta telefonda o'ynash</button></div>`;
  }
  function rulesHtml() {
    return `<div class="rules"><span class="lbl">Qoidalar</span>
      <span>Har raundda uchalangiz <b>bir vaqtda, yashirin</b> harakat tanlaysiz. Hamma tanlagach, natija chiqadi.</span>
      <span><b>Zarba</b> −${ATK} jon. <b>Qalqon</b> oddiy zarbani to'xtatadi, uruvchi esa −1 oladi. <b>Davolanish</b> +${HEAL}.</span>
      <span>Har raundda 1 kuch yig'iladi. 3 kuch bo'lsa <b>kuchli zarba</b> (−${SUP}) qalqonni ham yorib o'tadi.</span>
      <span>Ikki kishi bitta odamga birga ursa, har zarbaga +${TEAM}. Oxirgi tirik qolgan yutadi!</span></div>`;
  }

  $app.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.pick) pick(+b.dataset.pick);
    else if ('start' in b.dataset) startBattle();
    else if ('leave' in b.dataset) leave();
    else if (b.dataset.act) choose(b.dataset.act);
    else if ('ready' in b.dataset) { handoff = false; render(); }
    else if ('local' in b.dataset) { local = true; if (client) client.end(true); setNet(); startBattle(); }
    else if ('copy' in b.dataset) {
      const done = () => { b.textContent = 'Nusxa olindi ✓'; };
      try { navigator.clipboard.writeText(shareUrl).then(done, () => document.getElementById('share').select()); }
      catch (e) { document.getElementById('share').select(); }
    }
  });

  setNet(); render(); connect();
})();
</script>

</body>
</html>
