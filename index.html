<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uch Qahramon Poygasi</title>
</head>
<body style="margin:0;background:#fff">
<script>
// Loads the game fresh every time, so phones never show an old cached version.
fetch('game.html?t=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.text(); })
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(() => { location.replace('game.html' + location.search); });
</script>
</body>
</html>
