<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Uch Qahramon Poygasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Comic race: white dotted page, thick ink outlines, hard shadows. Lobby is one column; the race is a canvas with two steer buttons. */
:root{
  --bg:#fff; --ink:#111; --muted:#5d6068; --soft:#f3f3f3; --zap:#ffd400; --hp:#18b45b;
  --p0:#ff3b3b; --p1:#2f6bff; --p2:#ff9f00;
  --display:"Bangers","Impact","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#fff;background-image:radial-gradient(#e9e9e9 1.2px,transparent 1.3px);background-size:14px 14px;color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:520px;margin:0 auto;padding-block:14px 24px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0;letter-spacing:.03em;transform:rotate(-2deg);text-shadow:3px 3px 0 var(--zap);display:flex;align-items:center;gap:8px}
h1 em{font-style:normal;color:var(--p0)}
h1 .sw{display:inline-flex;width:38px;height:38px;border-radius:11px;background:var(--p0);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);align-items:center;justify-content:center;font-size:20px;transform:rotate(-8deg);text-shadow:none}
h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;letter-spacing:.03em;line-height:1.1}
.net{font:800 12px var(--body);display:flex;align-items:center;gap:6px;white-space:nowrap;border:2.5px solid var(--ink);border-radius:99px;padding:4px 10px;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.dot.on{background:var(--hp)}
.sub{margin:0;color:var(--muted);font-weight:700;line-height:1.45}
button{font-family:var(--body);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--zap);outline-offset:2px}
.card{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:14px;background:#fff}
.roster{display:grid;gap:12px}
.who{display:flex;align-items:center;gap:12px;padding:12px}
.who.mine{background:color-mix(in srgb,var(--c) 14%,#fff)}
.badge{width:48px;height:48px;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;flex:none;font:400 24px var(--display);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nm{font-weight:900;font-size:17px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:800 12px var(--body);padding:3px 9px;border-radius:99px;border:2px solid var(--ink);background:#fff}
.pill.on{background:#c9f7d9}
.btn{font-weight:900;font-size:15px;padding:10px 16px;border-radius:12px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:var(--ink);color:#fff}
.btn:disabled{background:#e4e4e4;color:#9a9a9a;box-shadow:none;border-color:#bbb}
.btn.big{width:100%;font:400 30px var(--display);letter-spacing:.04em;padding:14px;background:var(--p0);text-shadow:2px 2px 0 var(--ink);box-shadow:5px 5px 0 var(--ink)}
.btn.big:disabled{background:#e4e4e4;color:#9a9a9a;text-shadow:none;box-shadow:none}
.btn:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.notice{padding:12px 14px;font-weight:700;line-height:1.45}
.lbl{font-family:var(--display);font-size:20px;letter-spacing:.06em;display:inline-block;background:var(--zap);border:2.5px solid var(--ink);padding:2px 10px;border-radius:6px;transform:rotate(-2deg);align-self:flex-start}

/* race */
.race{display:flex;flex-direction:column;gap:10px}
#cv{display:block;width:100%;height:calc(100vh - 230px);height:calc(100dvh - 230px);min-height:340px;max-height:720px;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);background:#7cc576;touch-action:none}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{height:76px;font:400 40px var(--display);border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:4px 4px 0 var(--ink);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
.pad.down{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);background:var(--zap)}

/* results */
.res{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px}
.place{font:400 34px var(--display);width:34px;text-align:center}
.row .t{font:400 26px var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.win{text-align:center;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.trophy{font-size:60px;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.crown{font:400 42px var(--display);letter-spacing:.03em;color:var(--c);text-shadow:3px 3px 0 var(--ink)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg)}}
@media (prefers-reduced-motion:reduce){.trophy{animation:none}}
</style>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="sw">🏁</span>Uch <em>Poyga</em></h1>
    <div class="net" id="net"><span class="dot"></span><span>Ulanmoqda...</span></div>
  </header>
  <main id="app"></main>
</div>

<script>
(() => {
  const ROSTER = ['Shahzod', 'Sardor', 'Ahmat'];
  const COLORS = ['#ff3b3b', '#2f6bff', '#ff9f00'];
  const TRACK = 2000, VMAX = 55, ACC = 16, FRESH = 150000;   // metres, m/s, m/s², ms a race stays "live"
  const $app = document.getElementById('app'), $net = document.getElementById('net');

  // ---------- connection: a public MQTT broker, one fixed room ----------
  const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
  const params = new URLSearchParams(location.search);
  const code = (params.get('xona') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12) || 'asosiy';
  const T = 'uchqahramon/poyga1/' + code, KEY = 'uqp:' + code;

  let client = null, connected = false, brokerIdx = 0, everConnected = false, noRoom = false, synced = false;
  let me = -1, gid = 0, players = [0, 1, 2];
  let online = [false, false, false];
  let results = [null, null, null];   // {g, t} finish time in seconds
  let others = [null, null, null];    // {g, d, x} live position
  let race = null;

  try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); if (Number.isInteger(s.me)) me = s.me; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ me })); } catch (e) {} };
  const pub = (t, v, retain = true) => { if (client && connected) client.publish(`${T}/${t}`, v, { retain, qos: retain ? 1 : 0 }); };
  const onlineCount = () => online.filter(Boolean).length;

  function setNet() {
    $net.innerHTML = connected ? '<span class="dot on"></span><span>Onlayn</span>'
      : everConnected ? '<span class="dot"></span><span>Qayta ulanmoqda...</span>'
      : noRoom ? '<span class="dot"></span><span>Oflayn</span>' : '<span class="dot"></span><span>Ulanmoqda...</span>';
  }

  let queued = false;
  const later = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };

  function onMsg(topic, msg) {
    const [kind, n] = topic.slice(T.length + 1).split('/');
    const i = +n;
    if (kind === 'on' && i >= 0 && i < 3) online[i] = msg === '1';
    else if (kind === 'g') {
      const [gs, ps] = msg.split('|');
      const g = +gs || 0;
      const pl = ps ? [...new Set([...ps].map(Number))].filter(k => k >= 0 && k < 3) : [];
      if (g !== gid) { gid = g; players = pl.length >= 2 ? pl : [0, 1, 2]; others = [null, null, null]; decide(); }
    } else if (kind === 'f' && i >= 0 && i < 3) {
      try { const d = JSON.parse(msg); if (typeof d.g === 'number' && typeof d.t === 'number') results[i] = d; } catch (e) {}
    } else if (kind === 'pos' && i >= 0 && i < 3 && i !== me) {
      try { const d = JSON.parse(msg); if (typeof d.g === 'number' && typeof d.d === 'number') others[i] = { g: d.g, d: d.d, x: +d.x || .5 }; } catch (e) {}
      if (race && !race.fin) return;   // the race loop draws positions itself
    }
    later();
  }

  function connect() {
    if (typeof mqtt === 'undefined') { noRoom = true; setNet(); render(); return; }
    if (client) { const old = client; client = null; try { old.end(true); } catch (e) {} }
    connected = false; setNet();
    const opts = { clientId: 'uqp_' + Math.random().toString(36).slice(2, 10), keepalive: 15, reconnectPeriod: 2000, connectTimeout: 8000, clean: true };
    if (me >= 0) opts.will = { topic: `${T}/on/${me}`, payload: '0', retain: true, qos: 1 };
    const c = client = mqtt.connect(BROKERS[brokerIdx], opts);
    let ok = false;
    c.on('connect', () => {
      if (c !== client) return;
      ok = true; connected = true; everConnected = true; noRoom = false; setNet();
      c.subscribe(`${T}/#`, { qos: 1 });
      if (me >= 0) pub(`on/${me}`, '1');
      if (!synced) setTimeout(() => { synced = true; decide(); }, 800);
      render();
    });
    c.on('close', () => { if (c === client && connected) { connected = false; setNet(); render(); } });
    c.on('message', (t, buf) => { if (c === client) onMsg(t, buf.toString()); });
    setTimeout(() => {
      if (ok || c !== client) return;
      noRoom = true; brokerIdx = (brokerIdx + 1) % BROKERS.length; render(); connect();
    }, 9000);
  }

  // ---------- race ----------
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function buildTrack(seed) {
    const r = rng(seed % 2147483647), obs = [], lanes = [.2, .5, .8];
    let y = 70;
    while (y < TRACK - 50) {
      y += 18 + r() * 16;
      const free = Math.floor(r() * 3);
      for (let k = 0; k < 3; k++) {
        if (k === free || r() < .4) continue;
        const roll = r();
        obs.push({ d: y, x: lanes[k], k: roll < .18 ? 'boost' : roll < .6 ? 'cone' : 'box', hit: false });
      }
    }
    return obs;
  }

  function decide() {
    if (!synced || me < 0) return render();
    if (race && race.gid === gid) return render();
    const done = results[me] && results[me].g === gid;
    if (gid && !done && players.includes(me) && Date.now() - gid < FRESH) startRace();
    render();
  }

  function newRace() {
    const pl = [0, 1, 2].filter(i => online[i]);
    if (pl.length < 2 || me < 0) return;
    gid = Date.now(); players = pl; others = [null, null, null];
    pub('g', gid + '|' + pl.join(''));
    startRace(); render();
  }

  function startRace() {
    race = { gid, obs: buildTrack(gid), d: 0, x: .5, v: 0, steer: 0, boostUntil: 0, crashUntil: 0,
             start: performance.now() + Math.max(0, gid + 3500 - Date.now()), fin: false, time: 0, lastPub: 0, last: performance.now() };
    keys.l = keys.r = false;
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
    requestAnimationFrame(tick);
  }

  const keys = { l: false, r: false };
  function tick(now) {
    if (!race || race.fin || race.gid !== gid) return;
    const R = race, dt = Math.min(.05, (now - R.last) / 1000); R.last = now;
    const t = now - R.start;
    if (t >= 0) {
      R.steer = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
      R.x = Math.max(.1, Math.min(.9, R.x + R.steer * dt * 1.5));
      const boosted = now < R.boostUntil, crashed = now < R.crashUntil;
      const top = crashed ? 14 : boosted ? VMAX * 1.45 : VMAX;
      R.v = R.v < top ? Math.min(top, R.v + (boosted ? ACC * 2.5 : ACC) * dt) : Math.max(top, R.v - 40 * dt);
      const prev = R.d; R.d += R.v * dt;
      for (const o of R.obs) {
        if (o.hit || o.d < prev - 1.5 || o.d > R.d + 1.5) continue;
        if (Math.abs(o.x - R.x) < .17) {
          o.hit = true;
          if (o.k === 'boost') { R.boostUntil = now + 1600; buzz(30); }
          else { R.v *= .25; R.crashUntil = now + 800; buzz(160); }
        }
      }
      if (R.d >= TRACK) {
        R.d = TRACK; R.fin = true; R.time = Math.round(t / 100) / 10;
        results[me] = { g: R.gid, t: R.time };
        pub(`f/${me}`, JSON.stringify(results[me]));
        pub(`pos/${me}`, JSON.stringify({ g: R.gid, d: TRACK, x: R.x }), false);
        draw(now); setTimeout(render, 900); return;
      }
    }
    if (now - R.lastPub > 160) { R.lastPub = now; pub(`pos/${me}`, JSON.stringify({ g: R.gid, d: Math.round(R.d * 10) / 10, x: Math.round(R.x * 100) / 100 }), false); }
    draw(now);
    requestAnimationFrame(tick);
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---------- drawing ----------
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function car(c, cx, cy, w, color, alpha) {
    const h = w * 1.7;
    c.save(); c.globalAlpha = alpha; c.translate(cx, cy);
    c.fillStyle = '#111';
    for (const [sx, sy] of [[-1, -.32], [1, -.32], [-1, .3], [1, .3]]) { rr(c, sx * w * .5 - w * .13, sy * h - h * .11, w * .26, h * .22, 3); c.fill(); }
    rr(c, -w / 2, -h / 2, w, h, w * .28); c.fillStyle = color; c.fill(); c.lineWidth = 3; c.strokeStyle = '#111'; c.stroke();
    rr(c, -w * .32, -h * .22, w * .64, h * .22, 5); c.fillStyle = '#cfe9ff'; c.fill(); c.lineWidth = 2; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.85)'; rr(c, -w * .08, -h * .46, w * .16, h * .9, 3); c.fill();
    c.restore();
  }
  function draw(now) {
    const cv = document.getElementById('cv'); if (!cv || !race) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = race, ppm = H / 42, carY = H * .78;
    const shake = now < R.crashUntil ? (Math.random() - .5) * 8 : 0;
    const roadL = W * .1, roadW = W * .8;
    const sx = x => roadL + x * roadW + shake, sy = d => carY - (d - R.d) * ppm;
    // grass + road
    c.fillStyle = '#7cc576'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#4a4d55'; c.fillRect(roadL, 0, roadW, H);
    // kerbs
    const stripe = 4;
    for (let k = Math.floor((R.d - 12) / stripe); k < (R.d + 46) / stripe; k++) {
      const y = sy((k + 1) * stripe);
      c.fillStyle = k % 2 ? '#fff' : '#ff3b3b';
      c.fillRect(roadL - 10, y, 10, stripe * ppm); c.fillRect(roadL + roadW, y, 10, stripe * ppm);
    }
    // lane dashes
    c.fillStyle = 'rgba(255,255,255,.85)';
    for (let k = Math.floor((R.d - 12) / 8); k < (R.d + 46) / 8; k++) {
      const y = sy(k * 8 + 4);
      for (const lx of [1 / 3, 2 / 3]) c.fillRect(roadL + lx * roadW - 3, y, 6, 4 * ppm);
    }
    // finish line
    const fy = sy(TRACK);
    if (fy > -40 && fy < H + 40) {
      const sq = roadW / 10;
      for (let k = 0; k < 10; k++) for (let j = 0; j < 2; j++) { c.fillStyle = (k + j) % 2 ? '#111' : '#fff'; c.fillRect(roadL + k * sq, fy - (j + 1) * sq / 2, sq, sq / 2); }
    }
    // obstacles
    for (const o of R.obs) {
      const y = sy(o.d); if (y < -40 || y > H + 40) continue;
      const x = sx(o.x), s = roadW * .11;
      if (o.k === 'boost') {
        c.globalAlpha = o.hit ? .35 : 1;
        rr(c, x - s, y - s * .7, s * 2, s * 1.4, 8); c.fillStyle = '#ffd400'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#111'; c.stroke();
        c.save(); c.translate(x, y); c.rotate(-Math.PI / 2);
        c.fillStyle = '#111'; c.font = `400 ${s * 1.3}px Bangers, Impact, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('»', 0, 0);
        c.restore(); c.globalAlpha = 1;
      } else if (o.k === 'cone') {
        c.save(); c.translate(x, y); if (o.hit) c.rotate(1.2);
        c.beginPath(); c.moveTo(0, -s * .9); c.lineTo(s * .65, s * .6); c.lineTo(-s * .65, s * .6); c.closePath();
        c.fillStyle = '#ff7a00'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#111'; c.stroke();
        c.fillStyle = '#fff'; c.fillRect(-s * .32, -s * .05, s * .64, s * .2);
        c.restore();
      } else {
        c.save(); c.translate(x, y); if (o.hit) c.rotate(.5);
        rr(c, -s * .8, -s * .8, s * 1.6, s * 1.6, 4); c.fillStyle = '#b5773a'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#111'; c.stroke();
        c.beginPath(); c.moveTo(-s * .8, -s * .8); c.lineTo(s * .8, s * .8); c.moveTo(s * .8, -s * .8); c.lineTo(-s * .8, s * .8); c.lineWidth = 2; c.stroke();
        c.restore();
      }
    }
    // other cars
    const cw = roadW * .15;
    c.font = '900 13px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
    for (const i of players) {
      if (i === me) continue;
      const o = others[i]; if (!o || o.g !== R.gid) continue;
      const y = sy(o.d); if (y < -60 || y > H + 60) continue;
      car(c, sx(o.x), y, cw, COLORS[i], .55);
      c.fillStyle = '#111'; c.fillText(ROSTER[i], sx(o.x), y - cw * .95);
    }
    // my car
    if (now < R.boostUntil) { c.fillStyle = 'rgba(255,212,0,.6)'; c.beginPath(); c.moveTo(sx(R.x) - cw * .35, carY + cw * .85); c.lineTo(sx(R.x), carY + cw * (1.6 + Math.random() * .6)); c.lineTo(sx(R.x) + cw * .35, carY + cw * .85); c.fill(); }
    car(c, sx(R.x), carY, cw, COLORS[me], 1);
    // progress strip
    const px = 14, pw = W - 28, py = 14;
    rr(c, px, py, pw, 12, 6); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#111'; c.stroke();
    for (const i of players) {
      const d = i === me ? R.d : others[i] && others[i].g === R.gid ? others[i].d : 0;
      const x = px + 6 + (pw - 12) * Math.min(1, d / TRACK);
      c.beginPath(); c.arc(x, py + 6, i === me ? 9 : 7, 0, Math.PI * 2); c.fillStyle = COLORS[i]; c.fill(); c.lineWidth = 2.5; c.stroke();
    }
    // speed + distance
    c.textAlign = 'left'; c.textBaseline = 'top'; c.font = '400 26px Bangers, Impact, sans-serif'; c.lineWidth = 4; c.strokeStyle = '#111'; c.fillStyle = '#fff';
    const sp = `${Math.round(R.v * 3.6)} KM/SOAT`, left = `${Math.max(0, Math.round(TRACK - R.d))} M QOLDI`;
    c.strokeText(sp, 14, py + 22); c.fillText(sp, 14, py + 22);
    c.strokeText(left, 14, py + 50); c.fillText(left, 14, py + 50);
    // countdown
    const t = now - R.start;
    if (t < 900) {
      const txt = t < -2000 ? '3' : t < -1000 ? '2' : t < 0 ? '1' : 'KETDIK!';
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `400 ${txt.length > 1 ? 64 : 110}px Bangers, Impact, sans-serif`;
      c.lineWidth = 8; c.strokeStyle = '#111'; c.strokeText(txt, W / 2, H * .4); c.fillStyle = t < 0 ? '#ffd400' : '#18b45b'; c.fillText(txt, W / 2, H * .4);
    }
    if (R.fin) {
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '400 72px Bangers, Impact, sans-serif';
      c.lineWidth = 8; c.strokeStyle = '#111'; c.strokeText('MARRA!', W / 2, H * .4); c.fillStyle = '#ffd400'; c.fillText('MARRA!', W / 2, H * .4);
    }
  }

  // ---------- screens ----------
  let lastHtml = '', screen = '';
  const setApp = (h, name) => { screen = name; if (h !== lastHtml) { $app.innerHTML = h; lastHtml = h; } };
  const status = i => online[i] ? '<span class="pill on"><span class="dot on"></span>Onlayn</span>' : '<span class="pill"><span class="dot"></span>Oflayn</span>';
  const badge = i => `<div class="badge" style="--c:${COLORS[i]}">${ROSTER[i][0]}</div>`;
  const offlineNote = () => `<div class="card notice">Onlayn ulanib bo'lmadi. Internetni tekshirib, sahifani yangilang.</div>`;

  function render() {
    if (me < 0) return renderPick();
    if (race && race.gid === gid && !race.fin) return renderRace();
    const live = gid && (Date.now() - gid < FRESH || players.some(i => results[i] && results[i].g === gid));
    if (gid && live && (players.includes(me) ? results[me] && results[me].g === gid : true)) return renderResults();
    renderLobby();
  }

  function renderPick() {
    setApp(`
      <div style="display:flex;flex-direction:column;gap:14px">
        <h2>Siz kimsiz?</h2>
        ${noRoom ? offlineNote() : ''}
        <div class="roster">${ROSTER.map((n, i) => `
          <div class="card who">
            ${badge(i)}
            <div class="meta"><span class="nm">${n}</span>${status(i)}</div>
            <button class="btn" data-pick="${i}" ${online[i] ? 'disabled' : ''}>${online[i] ? 'Band' : 'Bu menman'}</button>
          </div>`).join('')}
        </div>
      </div>`, 'pick');
  }

  function renderLobby() {
    const n = onlineCount(), ok = n >= 2 && connected;
    setApp(`
      <div style="display:flex;flex-direction:column;gap:14px">
        <h2>Salom, <span style="color:${COLORS[me]}">${ROSTER[me]}</span>!</h2>
        <p class="sub">${ok ? `${n} kishi onlayn. Poygani boshlash mumkin!` : 'Kamida yana bitta poygachi onlayn bo\'lishini kuting.'}</p>
        ${noRoom ? offlineNote() : ''}
        <div class="roster">${ROSTER.map((nm, i) => `
          <div class="card who${i === me ? ' mine' : ''}" style="--c:${COLORS[i]}">
            ${badge(i)}
            <div class="meta"><span class="nm">${nm}${i === me ? ' (siz)' : ''}</span>${status(i)}</div>
          </div>`).join('')}
        </div>
        <button class="btn big" data-start ${ok ? '' : 'disabled'}>Poygani boshlash</button>
      </div>`, 'lobby');
  }

  function renderRace() {
    if (screen === 'race' && document.getElementById('cv')) return;
    setApp(`
      <div class="race">
        <canvas id="cv"></canvas>
        <div class="pads">
          <button class="pad" data-steer="l" aria-label="Chapga">◀</button>
          <button class="pad" data-steer="r" aria-label="O'ngga">▶</button>
        </div>
      </div>`, 'race');
    wireRace();
  }

  function renderResults() {
    const rows = players.map(i => {
      const r = results[i] && results[i].g === gid ? results[i].t : null;
      const o = others[i] && others[i].g === gid ? others[i].d : 0;
      return { i, r, o };
    }).sort((a, b) => (a.r ?? 1e9) - (b.r ?? 1e9) || b.o - a.o);
    const allDone = players.every(i => (results[i] && results[i].g === gid) || !online[i]) || Date.now() - gid > FRESH;
    const w = rows[0] && rows[0].r != null && allDone ? rows[0].i : -1;
    const n = onlineCount();
    setApp(`
      <div style="display:flex;flex-direction:column;gap:14px">
        ${w >= 0 ? `<div class="card win" style="--c:${COLORS[w]}"><div class="trophy">🏆</div><div class="crown">${ROSTER[w]} yutdi!</div></div>`
                 : `<span class="lbl">Poyga ketyapti</span>`}
        <div class="res">${rows.map((x, k) => `
          <div class="card row">
            <span class="place">${x.r != null ? k + 1 : '–'}</span>
            ${badge(x.i)}
            <div class="meta"><span class="nm">${ROSTER[x.i]}${x.i === me ? ' (siz)' : ''}</span>
              ${x.r == null ? `<span class="sub">${online[x.i] ? `Yo'lda: ${Math.round(x.o / 10) * 10} m` : 'Chiqib ketdi'}</span>` : ''}</div>
            <span class="t">${x.r != null ? x.r.toFixed(1) + ' s' : ''}</span>
          </div>`).join('')}
        </div>
        <button class="btn big" data-start ${allDone && n >= 2 && connected ? '' : 'disabled'}>Yangi poyga</button>
      </div>`, 'results');
  }

  // ---------- input ----------
  function wireRace() {
    const set = (side, on, el) => { keys[side] = on; if (el) el.classList.toggle('down', on); };
    document.querySelectorAll('[data-steer]').forEach(b => {
      const s = b.dataset.steer;
      b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} set(s, true, b); });
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => set(s, false, b));
      b.addEventListener('contextmenu', e => e.preventDefault());
    });
    const cv = document.getElementById('cv');
    const held = new Map();
    cv.addEventListener('pointerdown', e => { e.preventDefault(); const s = e.offsetX < cv.clientWidth / 2 ? 'l' : 'r'; held.set(e.pointerId, s); keys[s] = true; });
    const up = e => { const s = held.get(e.pointerId); if (s) { held.delete(e.pointerId); if (![...held.values()].includes(s)) keys[s] = false; } };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  }
  addEventListener('keydown', e => { if (e.key === 'ArrowLeft') keys.l = true; if (e.key === 'ArrowRight') keys.r = true; });
  addEventListener('keyup', e => { if (e.key === 'ArrowLeft') keys.l = false; if (e.key === 'ArrowRight') keys.r = false; });

  $app.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.pick) { const i = +b.dataset.pick; if (online[i]) return; me = i; save(); connect(); render(); }
    else if ('start' in b.dataset) newRace();
  });

  setInterval(() => { if (!race || race.fin) render(); }, 5000);   // lets "live" screens expire on their own
  setNet(); render(); connect();
})();
</script>
</body>
</html>
